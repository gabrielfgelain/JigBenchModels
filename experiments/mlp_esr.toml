# Perceptron (MLP) to estimate the bus ESR from the measured features.
# Run with `python -m jigbench.train experiments/mlp_esr.toml`.
# Copy this file and change the values to try another configuration.

[data]
target = "ESR_mOhm"
features = [
    "A120", "A240", "A360", "A6f",           # rectifier ripple and 6f1 on the bus
    "Asw", "Asw_band", "HF_rms",             # switching ripple (~5 kHz) on the bus
    "Vdc", "Vdc_pp",                         # bus voltage
    "I1", "V1", "Im_rms", "Vm_rms",          # motor current and voltage
    "rpm",                                   # speed command, known by the inverter
]
# The load power setpoint (power_W) is not used: an embedded estimator would not know it.

[model]
hidden_layers = [16]      # neurons per hidden layer: [16] = 1 layer, [32, 16] = 2 layers
activation = "relu"       # relu, sigmoid or tanh
learning_rate = 0.001     # size of each weight adjustment
weight_decay = 0.0001     # penalty on large weights (higher = smoother model)
batch_size = 200          # tests per weight adjustment
epochs = 1000             # passes over the training set
print_every = 50          # epochs between progress lines
seed = 2026
